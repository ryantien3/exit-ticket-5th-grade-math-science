# The pods' Kubernetes identity (api Deployment and migrate Job). Apply with:
#   sed "s/PROJECT_ID/$(gcloud config get project)/g" k8s/serviceaccount.yaml | kubectl apply -f -
#
# Workload Identity Federation for GKE gives it Google credentials with no key file, two ways:
# - The Cloud SQL Auth Proxy impersonates the Google SA in the annotation (it has
#   roles/cloudsql.client and roles/cloudsql.instanceUser, and is the IAM database user).
#   That needs roles/iam.workloadIdentityUser on the Google SA for this KSA.
# - The Secret Manager add-on authenticates as this KSA directly (its principal:// identifier
#   has roles/secretmanager.secretAccessor on each secret).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: exit-ticket
  annotations:
    iam.gke.io/gcp-service-account: exit-ticket-api@PROJECT_ID.iam.gserviceaccount.com
# No pod calls the Kubernetes API, so no Kubernetes API token is mounted. Google credentials
# come from the GKE metadata server, not from this token.
automountServiceAccountToken: false
