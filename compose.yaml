# Local development only: a Postgres database for the API to talk to, and nginx
# serving the web app (and forwarding /api/ to the API) on http://localhost:8080.
# The credentials below are throwaway values that exist only on your laptop.
# The API itself is not containerized yet (that's Phase 3).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: exitticket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: exitticket
    ports:
      # 127.0.0.1 = reachable only from this laptop, not from other devices on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume: data survives "docker compose down" (but not "down -v").
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exitticket -d exitticket"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: nginx:1.30-alpine
    environment:
      # Where nginx forwards /api/ requests (host:port). host.docker.internal means
      # "the Mac running Docker", i.e. the uvicorn you start in a terminal on port 8000.
      API_HOST: host.docker.internal:8000
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # :ro = read-only: nginx can serve these files but never change them.
      - ./app/web/public:/usr/share/nginx/html:ro
      # Mounted as a .template so the image fills in ${API_UPSTREAM} at startup.
      - ./app/web/nginx.conf:/etc/nginx/templates/default.conf.template:ro

volumes:
  pgdata:
