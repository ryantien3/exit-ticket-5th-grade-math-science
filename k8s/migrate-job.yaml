# Runs "alembic upgrade head" once, with the same image as the api. Apply with:
#   sed "s/PROJECT_ID/$(gcloud config get project)/g" k8s/migrate-job.yaml | kubectl apply -f -
# A Job's pod template can't be changed, so to run it again: delete the Job, then apply.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: exit-ticket
  labels:
    app: migrate
spec:
  # Retry up to 3 times (e.g. if the database isn't accepting connections yet),
  # with growing waits between tries: 10 s, 20 s, 40 s.
  backoffLimit: 3
  # Give up entirely after 5 minutes.
  activeDeadlineSeconds: 300
  # Delete the finished Job and its pod after an hour, so they don't pile up.
  # Until then, "kubectl logs job/migrate" still works.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: migrate
    spec:
      # Never: each retry is a new pod, so the logs of a failed try are kept.
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: us-east4-docker.pkg.dev/PROJECT_ID/exit-ticket/api@sha256:294082fd63314145a3693fffb52cb7ab6d368824ea67c724b6c67ec1bb02de7a
          command: ["alembic", "upgrade", "head"]
          # alembic/env.py loads the app settings, so the Job needs the same settings as the api.
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: exit-ticket-config
                  key: LOG_LEVEL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: SESSION_SECRET
            - name: TEACHER_PASSCODE
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: TEACHER_PASSCODE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
