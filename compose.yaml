# Local development only: a Postgres database for the API to talk to.
# The credentials below are throwaway values that exist only on your laptop.
# The API itself is not containerized yet (that's Phase 3).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: exitticket
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: exitticket
    ports:
      # 127.0.0.1 = reachable only from this laptop, not from other devices on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Named volume: data survives "docker compose down" (but not "down -v").
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exitticket -d exitticket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
