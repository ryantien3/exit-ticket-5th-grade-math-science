# Serves the student web app and forwards /api/ requests to the FastAPI service.
#
# The official nginx image treats this file as a template: at container start it
# replaces ${API_HOST} with that environment variable's value and writes the
# result to /etc/nginx/conf.d/default.conf. Only variables that are actually set
# get replaced, so nginx's own variables like $host are left alone.
#   Dev mode (uvicorn on your Mac): API_HOST=host.docker.internal:8000
#   Full-container mode (compose):  API_HOST=api:8000
#   Kubernetes (later):             API_HOST=api.<namespace>.svc.cluster.local:8000
#     (the full name: nginx's resolver doesn't use Kubernetes' DNS search domains)
# The image is nginx-unprivileged (runs as UID 101), so it listens on 8080, not 80.

# The DNS server to re-check API_HOST with: Docker's in compose, kube-dns on GKE.
# The image fills in NGINX_LOCAL_RESOLVERS from /etc/resolv.conf at startup.
# ipv6=off: ignore IPv6 answers (host.docker.internal's IPv6 address is unreachable).
resolver ${NGINX_LOCAL_RESOLVERS} valid=5s ipv6=off;

upstream api {
    # Shared memory for the upstream's state, required by "resolve".
    zone api 64k;
    # resolve: keep re-checking the name's IP while running, not just at startup.
    # A recreated api container can come back on a new IP.
    # max_fails=0: never mark the API as "down". By default nginx skips a server for
    # 10 seconds after a failed connection, so students would keep seeing errors
    # even after the API came back.
    server ${API_HOST} resolve max_fails=0;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;  # don't advertise the nginx version in errors and headers

    root /usr/share/nginx/html;
    index index.html;

    # The trailing slash after http://api strips the /api prefix:
    # /api/exit-tickets -> http://api/exit-tickets
    location /api/ {
        proxy_pass http://api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fail fast when the API is down, so the page can show its friendly error.
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        # One page, no client-side routes: anything that isn't a real file is a 404.
        try_files $uri $uri/ =404;

        # Browsers must check for a newer copy before reusing a cached file, so edits
        # show up on refresh. Unchanged files still come back as a quick 304.
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }
}
