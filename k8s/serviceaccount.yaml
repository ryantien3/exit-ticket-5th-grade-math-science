# The pods' Kubernetes identity (api Deployment and migrate Job). Apply with:
#   sed "s/PROJECT_ID/$(gcloud config get project)/g" k8s/serviceaccount.yaml | kubectl apply -f -
#
# Workload Identity Federation for GKE gives it Google credentials with no key file. Because of the
# annotation, everything in these pods acts as the Google SA exit-ticket-api (this needs
# roles/iam.workloadIdentityUser on that SA for this KSA):
# - the Cloud SQL Auth Proxy (roles/cloudsql.client, roles/cloudsql.instanceUser; the SA is the
#   IAM database user);
# - the Secret Manager add-on too (roles/secretmanager.secretAccessor on each secret). Verified in
#   Phase 4C: a grant to this KSA's principal:// identifier alone gave PermissionDenied.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: exit-ticket
  annotations:
    iam.gke.io/gcp-service-account: exit-ticket-api@PROJECT_ID.iam.gserviceaccount.com
# No pod calls the Kubernetes API, so no Kubernetes API token is mounted. Google credentials
# come from the GKE metadata server, not from this token.
automountServiceAccountToken: false
