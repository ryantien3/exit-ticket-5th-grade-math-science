# Which Secret Manager secrets the GKE Secret Manager add-on mounts, and as which files.
# Needs a cluster created with --enable-secret-manager. Apply with:
#   sed "s/PROJECT_ID/$(gcloud config get project)/g" k8s/secretproviderclass.yaml | kubectl apply -f -
#
# Pods that mount it see /var/secrets/exit-ticket/session_secret and .../teacher_passcode
# (app/api/app/config.py reads those files). The values never become Kubernetes Secrets.
#
# Versions are pinned, like images by digest. To rotate: add a version in Secret Manager,
# change the number here, apply, then "kubectl -n exit-ticket rollout restart deployment/api".
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: app-secrets
  namespace: exit-ticket
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/PROJECT_ID/secrets/session-secret/versions/1"
        path: "session_secret"
      - resourceName: "projects/PROJECT_ID/secrets/teacher-passcode/versions/1"
        path: "teacher_passcode"
